<section class="section form-section" id="form">
    <div class="container form-section-container">
        <div class="form-container">
            <h2 class="form-headline">Rent a yacht now</h2>
            <form class="main-form">
                <input class="form-input" type="text" name="name" id="name" placeholder="Full Name">
                <input class="form-input" type="text" name="email" id="email" placeholder="Email">
                <input class="form-input" type="text" name="phone" id="phone" placeholder="Phone number">
                <textarea class="form-input form-textarea" name="comment" id="comment" class="form-text" placeholder="Comment"></textarea>
                <button class="form-btn">Send</button>
            </form>
        </div>
        <picture class="picture-form-preview">
            <!-- >1400px -->
            <source media="(min-width:1400px)" type="image/webp" srcset="/img/form/webp/jacht-form-pc2.webp 1x,
                            /img/form/webp/jacht-form-pc2@2x.webp 2x">
            <source media="(min-width:1400px)" srcset="/img/form/jacht-form-pc2.jpg 1x,
                            /img/form/jacht-form-pc2@2x.jpg 2x">
        
            <!-- >1200px -->
            <source media="(min-width:1200px)" type="image/webp" srcset="/img/form/webp/jacht-form-pc.webp 1x,
                          /img/form/webp/jacht-form-pc@2x.webp 2x">
            <source media="(min-width:1200px)" srcset="/img/form/jacht-form-pc.jpg 1x,
                          /img/form/jacht-form-pc@2x.jpg 2x">
        
            <!-- >768px -->
            <source media="(min-width:768px)" type="image/webp" srcset="/img/form/webp/jacht-form-tab.webp 1x,
                          /img/form/webp/jacht-form-tab@2x.webp 2x">
            <source media="(min-width:768px)" srcset="/img/form/jacht-form-tab.jpg 1x,
                          /img/form/jacht-form-tab@2x.jpg 2x">
        
            <!-- <768px -->
            <source type="image/webp" srcset="/img/form/webp/jacht-form-mob.webp 1x,
                          /img/form/webp/jacht-form-mob@2x.webp 2x">
        
            <img class="jacht-form-img" src="/img/form/jacht-form-mob.jpg" srcset="/img/form/jacht-form-mob.jpg 1x,
                       /img/form/jacht-form-mob@2x.jpg 2x" width="335" height="412" alt="Яхта вночі">
        </picture>
    </div>
</section>
